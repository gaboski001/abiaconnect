    <!-- Native app launch: flag the launch so the Android app keeps its splash
         overlay (navy + logo) up until the first screen has painted.
         NativeOnboardingGate clears it; it self-clears after 8s as a safety net. -->
    <script>
      (function () {
        try {
          var cap = window.Capacitor;
          if (!cap || !cap.isNativePlatform || !cap.isNativePlatform()) return;
          var root = document.documentElement;
          // App-only styling hook (Tailwind `native:` variant, see index.css).
          root.classList.add('native-app');
          if (location.pathname !== '/') return;
          root.classList.add('cap-launch');
          setTimeout(function () { root.classList.remove('cap-launch'); }, 8000);
        } catch (e) {}
      })();
