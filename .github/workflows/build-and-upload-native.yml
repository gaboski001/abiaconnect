name: Build & Upload Native Apps

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver version (e.g. 1.2.3)'
        required: true
      changelog:
        description: 'Release notes (markdown)'
        required: false
        default: ''

env:
  UPLOAD_URL: https://tnwgnowjmrbjugheorkv.supabase.co/functions/v1/upload-release

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      changelog: ${{ steps.v.outputs.changelog }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
            echo "changelog=Release ${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "${{ github.event.inputs.changelog }}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

  android:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      - name: Install deps
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Add Android platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK to admin storage
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -n1)
          echo "Uploading $APK"
          curl -fSL -X POST "$UPLOAD_URL" \
            -H "x-upload-token: ${{ secrets.RELEASE_UPLOAD_TOKEN }}" \
            -F "platform=android" \
            -F "version=${{ needs.resolve.outputs.version }}" \
            -F "changelog=${{ needs.resolve.outputs.changelog }}" \
            -F "file=@$APK"

  ios:
    needs: resolve
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }

      - name: Install deps
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Add iOS platform
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Import signing certificate
        if: ${{ secrets.IOS_P12_BASE64 != '' }}
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ci-temp
        run: |
          echo "$P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Install provisioning profile
        if: ${{ secrets.IOS_MOBILEPROVISION_BASE64 != '' }}
        env:
          PROFILE: ${{ secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/ci.mobileprovision

      - name: Archive & export IPA
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -archivePath $PWD/build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO
          xcodebuild -exportArchive -archivePath $PWD/build/App.xcarchive \
            -exportPath $PWD/build -exportOptionsPlist ExportOptions.plist || true

      - name: Upload IPA to admin storage
        run: |
          IPA=$(find ios -name "*.ipa" | head -n1)
          if [ -z "$IPA" ]; then echo "No IPA produced (signing required)"; exit 0; fi
          curl -fSL -X POST "$UPLOAD_URL" \
            -H "x-upload-token: ${{ secrets.RELEASE_UPLOAD_TOKEN }}" \
            -F "platform=ios" \
            -F "version=${{ needs.resolve.outputs.version }}" \
            -F "changelog=${{ needs.resolve.outputs.changelog }}" \
            -F "file=@$IPA"
