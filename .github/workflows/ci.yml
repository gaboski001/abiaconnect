name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Security gate (sensitive keys + RLS exposure)
        run: npm run check:security

      - name: Realtime handler gate (no invalidateQueries inside useRealtimeChannel)
        run: npm run check:realtime

      - name: Build abiaconnect
        run: npm run build

      - name: Backend-leak scan on built bundle
        run: npm run check:leaks
